name: Bug report
description: Report reproducible Shotlane behavior
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Shotlane. Do not attach private screenshots, clipboard contents, file paths, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: Shotlane version
      placeholder: "1.0.0 (build number)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: "macOS version, Apple silicon or Intel"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Region or window capture
        - Full-display capture
        - Scrolling capture
        - Annotation
        - OCR
        - Color picker
        - Pin
        - Export
        - Shortcuts or permissions
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
